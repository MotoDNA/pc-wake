# 파일을 GitHub에 올릴 때마다 앱(APK)을 자동으로 만들어 'Releases'에 올립니다.
name: 앱 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 버전 번호 정하기
        run: |
          N=$(( ${{ github.run_number }} + 10 ))
          echo "VERSION_CODE=$N" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.$N" >> $GITHUB_ENV

      - name: APK 만들기
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::서명 키가 아직 등록되지 않았어요. 저장소 Settings › Secrets and variables › Actions 에 KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD 를 넣어 주세요."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PC-Wake.apk
          cd pc-setup && zip -r ../dist/PC-setup.zip . && cd ..

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: PC 원격켜기 v${{ env.VERSION_NAME }}
          make_latest: true
          body: |
            ## 받는 법
            - 📱 **PC-Wake.apk** : 안드로이드 폰/탭에 설치하는 앱 (리모컨·중계기 겸용)
            - 🖥 **PC-setup.zip** : 켜고 싶은 윈도우 PC에서 압축을 풀고 `START-PC-Setup.bat` 실행

            자세한 설명은 저장소 첫 화면(README)을 보세요.
          files: |
            dist/PC-Wake.apk
            dist/PC-setup.zip
